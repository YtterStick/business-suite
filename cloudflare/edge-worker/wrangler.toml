name = "tactiq-edge"
main = "src/index.ts"
compatibility_date = "2026-01-01"

[triggers]
# Keep Render Free/Starter warm every 10 minutes + run DB cleanup daily at 03:00 UTC
crons = ["*/10 * * * *", "0 3 * * *"]

[[r2_buckets]]
binding = "FILES_BUCKET"
bucket_name = "tactiq-files"

[vars]
# Replace with your Render web service origin (e.g. https://tactiq-web.onrender.com)
RENDER_ORIGIN = "https://your-tactiq-service.onrender.com"

# Store CRON_SECRET as an encrypted Worker secret instead of plain text:
# npx wrangler secret put CRON_SECRET
